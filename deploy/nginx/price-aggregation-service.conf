server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/suren/Projects/Go/price-aggregation-service/web/dist;
    index index.html;

    # React dashboard (static build)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html itself is never
    # cached so a new deploy is picked up on the next page load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend API - proxied straight through to the Go service on localhost.
    location ~ ^/(price|health|config|metrics)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
